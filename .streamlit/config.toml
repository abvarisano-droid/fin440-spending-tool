[browser]
gatherUsageStats = false

# Viewers get a clean toolbar: no developer menu items.
[client]
toolbarMode = "minimal"

# Theme: Ashton Capes site, Liquid Glass v8 light (live site assets/glass.css + v8.css + kronos.css).
[theme]
base = "light"
primaryColor = "#0B7A75"
backgroundColor = "#F0F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1D1B"
linkColor = "#0B7A75"
borderColor = "#DCDFD8"
codeTextColor = "#1A1D1B"
codeBackgroundColor = "#EEF0EC"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "14px"
buttonRadius = "999px"
linkUnderline = false

baseFontSize = 16
baseFontWeight = 400
codeFontSize = "13px"
codeFontWeight = 400
headingFontSizes = ["44px", "30px", "22px", "18px", "16px", "14px"]
headingFontWeights = [400, 400, 400, 500, 500, 500]

font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "serif"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"

redColor = "#A3311F"
orangeColor = "#A8480A"
yellowColor = "#6B5208"
greenColor = "#0B7A75"
blueColor = "#2F4A66"
violetColor = "#553A73"
grayColor = "#4F5752"

redBackgroundColor = "#F6E4E0"
orangeBackgroundColor = "#F8E8DA"
yellowBackgroundColor = "#FBF1D3"
greenBackgroundColor = "#DEFAF8"
blueBackgroundColor = "#E8EDF3"
violetBackgroundColor = "#F1EBF6"
grayBackgroundColor = "#EEF0EC"

redTextColor = "#A3311F"
orangeTextColor = "#8A3B08"
yellowTextColor = "#6B5208"
greenTextColor = "#19373F"
blueTextColor = "#2F4A66"
violetTextColor = "#553A73"
grayTextColor = "#4F5752"

# Same order as core/ui.CATEGORICAL (one per spending category).
chartCategoricalColors = [
    "#8F958F",
    "#A3311F",
    "#6B5208",
    "#4F7A3A",
    "#B0603A",
    "#3F6F9E",
