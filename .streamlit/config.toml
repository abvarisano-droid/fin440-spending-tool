[browser]
gatherUsageStats = false

# Theme: Ashton Capes site system (ashton-capes-site/assets/styles.css, editorial layer).
[theme]
base = "light"
primaryColor = "#17603A"
backgroundColor = "#F5F5F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17251E"
linkColor = "#17603A"
borderColor = "#CCD5CB"
codeTextColor = "#17251E"
codeBackgroundColor = "#ECEEE9"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "14px"
buttonRadius = "999px"
linkUnderline = false

baseFontSize = 16
baseFontWeight = 400
codeFontSize = "13px"
codeFontWeight = 400
headingFontSizes = ["44px", "30px", "22px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 500, 500, 500, 500]

font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"

redColor = "#A3311F"
orangeColor = "#A8480A"
yellowColor = "#6B5208"
greenColor = "#17603A"
blueColor = "#2F4A66"
violetColor = "#553A73"
grayColor = "#42574B"

redBackgroundColor = "#F6E4E0"
orangeBackgroundColor = "#F8E8DA"
yellowBackgroundColor = "#FBF1D3"
greenBackgroundColor = "#E3EEE5"
blueBackgroundColor = "#E8EDF3"
violetBackgroundColor = "#F1EBF6"
grayBackgroundColor = "#ECEEE9"

redTextColor = "#A3311F"
orangeTextColor = "#8A3B08"
yellowTextColor = "#6B5208"
greenTextColor = "#10482B"
blueTextColor = "#2F4A66"
violetTextColor = "#553A73"
grayTextColor = "#42574B"

